name: vetcare_mobile
description: VetCare mobile app (Flutter) — cliente de la API REST de VetCare.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking
  dio: ^5.4.0
  retrofit: ^4.1.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Storage seguro (JWT)
  flutter_secure_storage: ^11.2.0

  # Biometría (huella / FaceID)
  local_auth: ^2.3.0

  # Navegación
  go_router: ^14.2.0

  # QR scan (asistencia)
  mobile_scanner: ^7.5.0

  # i18n
  intl: ^0.20.3

  # Utilidades
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  flutter_dotenv: ^6.0.2
  crypto: ^3.0.8
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  retrofit_generator: ^8.1.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/i18n/
    - assets/images/
  generate: true